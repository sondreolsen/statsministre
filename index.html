<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europas Politiske Ledere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="layout">
        <section class="map-card">
          <div class="section-head">
            <div>
              <p class="section-kicker">Kart</p>
              <h1 class="map-title">Europas politiske ledere</h1>
            </div>
            <div class="map-tools" aria-label="Kartkontroller">
              <button type="button" data-zoom="out">−</button>
              <button type="button" data-zoom="in">+</button>
              <button type="button" data-zoom="reset">Tilbake</button>
            </div>
          </div>
          <div class="map-stage">
            <div id="map-root" class="map-root" aria-label="Kart over Europa"></div>
            <aside class="floating-panel">
              <section class="detail-card">
                <div class="section-head">
                  <div>
                    <p class="section-kicker">Aktivt land</p>
                    <h2 id="active-country-title">Norge</h2>
                  </div>
                </div>
                <div id="detail-panel" class="detail-panel"></div>
              </section>
            </aside>
          </div>
        </section>
      </main>

      <section class="footnote-card">
        Dette er en hardkodet prototype, ikke en live-database. Politisk ledelse kan
        endre seg raskt, så listen bør oppdateres ved regjeringsskifter. Siste manuelle
        gjennomgang i denne versjonen: <strong id="source-date">14. mai 2026</strong>.
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
